name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff "origin/$BASE_REF...HEAD" > pr_diff.txt

      - name: Run Gemini AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import urllib.error
          import urllib.request

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not api_key:
              print("Skipping AI review: GEMINI_API_KEY is unavailable.")
              raise SystemExit(0)

          with open("pr_diff.txt", "r", encoding="utf-8") as f:
              diff = f.read()

          if not diff.strip():
              exit(0)

          max_diff_chars = 500_000
          diff_truncated = len(diff) > max_diff_chars
          if diff_truncated:
              diff = diff[:max_diff_chars]

          prompt = (
              "You are a senior software engineer reviewing a GitHub Pull Request. "
              "Provide a concise, constructive code review highlighting potential bugs, "
              "edge cases, security issues, and clean-code improvements. "
              + (
                  "The diff was truncated due to its size; clearly state that this review "
                  "covers only part of the changes. "
                  if diff_truncated
                  else ""
              )
              + "\n\n"
              + diff
          )

          url = (
              "https://generativelanguage.googleapis.com/v1beta/models/"
              "gemini-4-hydrogen:generateContent"
          )
          payload = json.dumps({"contents": [{"parts": [{"text": prompt}]}]}).encode("utf-8")
          req = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key,
              },
          )

          try:
              with urllib.request.urlopen(req, timeout=90) as resp:
                  result = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print("Gemini API error:", e.read().decode("utf-8", errors="replace"))
              raise

          if not isinstance(result, dict):
              raise RuntimeError("Gemini returned an unexpected response payload.")
          candidates = result.get("candidates")
          if not isinstance(candidates, list) or not candidates:
              feedback = result.get("promptFeedback", {})
              reason = (
                  feedback.get("blockReason", "unspecified")
                  if isinstance(feedback, dict)
                  else "unspecified"
              )
              raise RuntimeError(
                  f"Gemini returned no review candidate (block reason: {reason})."
              )
          candidate = candidates[0]
          if not isinstance(candidate, dict):
              raise RuntimeError("Gemini returned a malformed review candidate.")
          content = candidate.get("content", {})
          parts = content.get("parts", []) if isinstance(content, dict) else []
          if not isinstance(parts, list):
              raise RuntimeError("Gemini returned malformed review parts.")
          review = next(
              (
                  part["text"]
                  for part in parts
                  if isinstance(part, dict) and isinstance(part.get("text"), str)
              ),
              None,
          )
          if not review:
              raise RuntimeError("Gemini returned a candidate without review text.")

          comment_url = (
              f"https://api.github.com/repos/{os.environ['REPO']}/issues/"
              f"{os.environ['PR_NUMBER']}/comments"
          )
          comment_header = "### 🤖 Automated AI Code Review\n\n"
          comment_limit_bytes = 60_000
          truncation_notice = "\n\n[Review truncated to fit GitHub's comment size limit.]"
          body = comment_header + review
          if len(body.encode("utf-8")) > comment_limit_bytes:
              review_bytes = review.encode("utf-8")
              available_bytes = (
                  comment_limit_bytes
                  - len(comment_header.encode("utf-8"))
                  - len(truncation_notice.encode("utf-8"))
              )
              review = (
                  review_bytes[:available_bytes].decode("utf-8", errors="ignore")
                  + truncation_notice
              )
              body = comment_header + review
          comment_payload = json.dumps({"body": body}).encode("utf-8")
          comment_req = urllib.request.Request(
              comment_url,
              data=comment_payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          try:
              urllib.request.urlopen(comment_req, timeout=30).close()
          except urllib.error.HTTPError as e:
              print(
                  "GitHub comment API error:",
                  e.code,
                  e.read().decode("utf-8", errors="replace"),
              )
              raise
          EOF
