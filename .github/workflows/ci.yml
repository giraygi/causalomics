name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: causalomics_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/causalomics_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build

  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-playbook site.yml --syntax-check

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack with example data
        run: docker compose --profile import up --build -d
      - name: Wait for the importer to finish
        run: |
          for i in $(seq 1 60); do
            state=$(docker compose ps -a importer --format '{{.State}}')
            [ "$state" = "exited" ] && break
            sleep 3
          done
          docker compose logs importer
          test "$(docker compose ps -a importer --format '{{.ExitCode}}')" = "0"
      - name: Smoke test through the frontend proxy
        run: curl -fsS http://localhost:8080/api/health
      - if: always()
        run: docker compose --profile import down -v
