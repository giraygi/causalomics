---
# Removes ONLY Docker artifacts of this project, identified by the compose project
# name and the label {{ project_label_key }}={{ project_name }}. Shared images (e.g.
# postgres) and other projects are never touched. Volumes only if clean_remove_volumes.

- name: Check whether the compose project directory exists
  ansible.builtin.stat:
    path: "{{ app_dir }}/docker-compose.yml"
  register: compose_file

- name: Stop and remove the project's containers and networks
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    project_name: "{{ project_name }}"
    state: absent
    remove_orphans: true
    remove_volumes: "{{ clean_remove_volumes | bool }}"
  when: compose_file.stat.exists

# Fallback by label, e.g. when the compose directory is already gone.
- name: Find remaining labelled containers
  ansible.builtin.command: >-
    docker ps -aq --filter label={{ project_label_key }}={{ project_name }}
  register: leftover_containers
  changed_when: false

- name: Remove remaining labelled containers
  ansible.builtin.command: "docker rm -f {{ leftover_containers.stdout_lines | join(' ') }}"
  when: leftover_containers.stdout_lines | length > 0
  changed_when: true

- name: Find remaining labelled networks
  ansible.builtin.command: >-
    docker network ls -q --filter label={{ project_label_key }}={{ project_name }}
  register: leftover_networks
  changed_when: false

- name: Remove remaining labelled networks
  ansible.builtin.command: "docker network rm {{ leftover_networks.stdout_lines | join(' ') }}"
  when: leftover_networks.stdout_lines | length > 0
  changed_when: true

- name: Find images built for this project
  ansible.builtin.command: >-
    docker images -q --filter label={{ project_label_key }}={{ project_name }}
  register: project_images
  changed_when: false
  when: clean_remove_images | bool

- name: Remove images built for this project
  ansible.builtin.command: "docker rmi -f {{ project_images.stdout_lines | unique | join(' ') }}"
  when:
    - clean_remove_images | bool
    - project_images.stdout_lines | length > 0
  changed_when: true

- name: Find labelled volumes (database data)
  ansible.builtin.command: >-
    docker volume ls -q --filter label={{ project_label_key }}={{ project_name }}
  register: project_volumes
  changed_when: false
  when: clean_remove_volumes | bool

- name: Remove labelled volumes - deletes all stored data
  ansible.builtin.command: "docker volume rm {{ project_volumes.stdout_lines | join(' ') }}"
  when:
    - clean_remove_volumes | bool
    - project_volumes.stdout_lines | length > 0
  changed_when: true
