---
# Usage (run from the ansible/ directory):
#   ansible-playbook site.yml                          deploy (+ import if run_import: true)
#   ansible-playbook site.yml -e recreate_app_only=true rebuild backend + frontend, keep database
#   ansible-playbook site.yml --tags import            load example data only
#   ansible-playbook site.yml --tags clean             remove this project's Docker artifacts
# All settings: group_vars/all.yml

- name: CausalOmics differential expression application
  hosts: app
  gather_facts: true
  roles:
    - role: deploy
      tags: [deploy]
    - role: import
      tags: [import]
    # "never": cleaning only happens when explicitly requested with --tags clean
    - role: clean_project
      tags: [clean, never]
