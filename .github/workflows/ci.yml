name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt

      - name: Run Gemini AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request

          with open("pr_diff.txt", "r") as f:
              diff = f.read()[:15000]

          if not diff.strip():
              exit(0)

          api_key = os.environ["GEMINI_API_KEY"].strip()
          host = "https://googleapis.com"
          path = "/v1beta/models/gemini-2.5-flash:generateContent"
          url = f"{host}{path}?key={api_key}"

          prompt = (
              "You are a senior software engineer reviewing a GitHub Pull Request. "
              "Provide a concise, constructive code review highlighting potential bugs, "
              "edge cases, security issues, and clean-code improvements:\n\n" + diff
          )

          payload = json.dumps({
              "contents": [{"parts": [{"text": prompt}]}]
          }).encode("utf-8")

          req = urllib.request.Request(
              url,
              data=payload,
              headers={"Content-Type": "application/json"}
          )

          with urllib.request.urlopen(req) as resp:
              result = json.loads(resp.read().decode("utf-8"))
              first_candidate = result["candidates"].pop(0)
              first_part = first_candidate["content"]["parts"].pop(0)
              review = first_part["text"]

          repo = os.environ["REPO"].strip()
          pr_num = os.environ["PR_NUMBER"].strip()
          gh_token = os.environ["GH_TOKEN"].strip()
          comment_url = f"https://github.com{repo}/issues/{pr_num}/comments"

          comment_payload = json.dumps({
              "body": f"### 🤖 Automated AI Code Review\n\n{review}"
          }).encode("utf-8")

          comment_req = urllib.request.Request(
              comment_url,
              data=comment_payload,
              headers={
                  "Authorization": f"Bearer {gh_token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json"
              }
          )
          urllib.request.urlopen(comment_req)
          EOF
